#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y

#ZMK studio -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

# Rotary encoder configuration
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth PHY settings
CONFIG_BT_CTLR_PHY_2M=n

# Bluetooth connection interval settings (in units of 1.25ms)
# LiTom に合わせて既定値 (7.5ms) に戻した。15ms 固定は LiTom の実測で
# キー入力区間の途切れが増えたため。
# 右手 (central) は PC への接続間隔の希望を 7.5ms 固定にする (LiTom と同じ)。
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK Studio configuration
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

# Key debouncing settings (in milliseconds)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7


# Enable USB and Bluetooth connectivity
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

# Basic hardware configurations
CONFIG_INPUT=y
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_SENSOR=y

# PMW3610 optical sensor settings
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_SWAP_XY=y
CONFIG_PMW3610_ALT_INVERT_X=y
CONFIG_PMW3610_ALT_INVERT_Y=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# --- 以下 LiTom_R.conf に合わせた設定 ---
# センサー送信を 16ms ごとにまとめる (慣性スクロールの tick=16 と対応)。
# 8ms 刻みのため 16 ではなく 12 を指定する (詳細は LiTom_R.conf)。
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
# 省電力中のサンプリング間隔を短くし、触った瞬間のカーソル飛びを抑える。
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=100
# BLE のマウスレポート送信待ちを 20 -> 6 件に浅くして遅延を抑える。
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=6
# IDLE (= force-awake 解除) までを長くし、復帰時の壊れた移動量を避ける。
CONFIG_ZMK_IDLE_TIMEOUT=900000
